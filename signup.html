<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Signup - Cavalry Store</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>  <!-- 引入外部 JavaScript 文件 -->
</head>
<body>
<header class="header">
    <div class="logo">
        <img src="cavalry.png" alt="Cavalry Logo" width="100" height="100">
    </div>
    <div class="title" style="display: flex; align-items: center;">
        <h1 style="color: #020202; margin-left: 10px;">Cavalry</h1>
    </div>
</header>

<section class="main-content">
    <div class="container mt-4">
        <h2>User Signup</h2>
        <form id="signupForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" class="form-control" id="username" name="username">
                <div class="invalid-feedback">Username is required.</div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="text" class="form-control" id="email" name="email">
                <div class="invalid-feedback">Please enter a valid email address.</div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password">
                <div class="invalid-feedback">Password is required.</div>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" class="form-control" id="confirm-password" name="confirm-password">
                <div class="invalid-feedback">Passwords do not match.</div>
            </div>
            <button type="submit" class="btn btn-primary">Sign Up</button>
        </form>
    </div>
</section>

<footer class="footer">
    <p><a href="terms.html">Terms of Use</a></p>
    <p><a href="privacy.html">Cookie and Privacy Policy</a></p>
    <p>&copy; 2024 Cavalry Store. All Rights Reserved.</p>
</footer>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
